version: 1
filesystem_policy:
  include_workdir: false
  read_only: [/usr, /lib, /lib64, /etc, /app, /run/agent-config]
  read_write: [/tmp]
landlock:
  compatibility: hard_requirement
process:
  run_as_user: "10001"
  run_as_group: "10001"
network_policies:
  control_plane:
    endpoints:
      - host: host.openshell.internal
        port: 8765
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /v1/telemetry/CNC-01
          - allow:
              method: POST
              path: /v1/infer
          - allow:
              method: POST
              path: /v1/events
          - allow:
              method: POST
              path: /v1/drafts
    binaries:
      - path: /usr/local/bin/python3.12
