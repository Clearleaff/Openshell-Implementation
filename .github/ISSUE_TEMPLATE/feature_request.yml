name: Feature Request
description: Propose a new feature, adapter, or attack scenario
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thank you for suggesting improvements to PRESCPTR!
  - type: textarea
    id: problem
    attributes:
      label: Problem Description
      description: Is your feature request related to a problem or limitation?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered?
