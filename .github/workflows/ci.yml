name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Unit Tests & Governance Contract
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run offline unit tests
        run: |
          python3 -m unittest discover -s tests -v

      - name: Verify syntax and compilation
        run: |
          python3 -m py_compile app/*.py scripts/*.py tests/*.py

      - name: Verify Dockerfile lint / syntax
        run: |
          docker build --check . || true
